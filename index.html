function getQuiz(topic){
  const bank = QUIZ_DB[topic] || [
    {q:"What is the most effective study technique for "+topic+"?",options:["Re-reading notes","Active recall and practice questions","Highlighting textbooks","Listening to lectures repeatedly"],ans:1},
    {q:"When learning "+topic+", you should first:",options:["Memorise all facts","Understand core principles and frameworks","Start with the hardest topics","Skip fundamentals"],ans:1},
    {q:"The best way to prepare for a "+topic+" exam is:",options:["Study everything once","Past papers under timed conditions","Read the textbook cover to cover","Group study only"],ans:1},
    {q:"Spaced repetition in studying "+topic+" means:",options:["Studying for long hours in one session","Reviewing material at increasing time intervals","Spacing out your breaks","Studying with spaces between paragraphs"],ans:1},
    {q:"To deepen understanding of "+topic+", you should:",options:["Memorise definitions only","Try to teach it to someone else","Skip difficult sections","Only study before exams"],ans:1},
  ];
  if(bank.length<=5)return bank;
  const dateNum=parseInt(TODAY.replace(/-/g,''),10);
  const seed=topic.split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  const start=(dateNum+seed)%bank.length;
  const result=[];
  for(let i=0;i<5;i++)result.push(bank[(start+i)%bank.length]);
  return result;
}

    activeTopic:null,activeQuiz:null,quizState:null,
    notes:[],activeNote:null,noteStudy:null,noteQuiz:null,
  };
}

function loadState(){
  try{
    const raw=localStorage.getItem(STORE);
    if(!raw)return defaultState();
    const s=Object.assign(defaultState(),JSON.parse(raw));
    s.activeTopic=null;s.activeQuiz=null;s.quizState=null;
    if(s.reviewDate!==TODAY){s.reviewed=[];s.reviewDate=TODAY;}
    if(s.lastStudyDate){
      const diff=Math.round((new Date(TODAY)-new Date(s.lastStudyDate))/86400000);
      if(diff>1)s.studyDays=0;
    }
    return s;
  }catch(e){return defaultState();}
}

function saveState(){
  try{
    const t=Object.assign({},S);
    t.activeTopic=null;t.activeQuiz=null;t.quizState=null;t.reviewDate=TODAY;
    localStorage.setItem(STORE,JSON.stringify(t));
  }catch(e){}
}

const S=loadState();

// ─── DOM HELPERS ──────────────────────────────────────────────────────────────
function el(tag,style,children,attrs){
  const e=document.createElement(tag);
  if(style)e.style.cssText=style;
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k.startsWith('on'))e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==='className')e.className=v;
    else e.setAttribute(k,v);
  });
  if(children)([].concat(children)).forEach(c=>{
    if(c==null)return;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  });
  return e;
}
function div(s,c,a){return el('div',s,c,a);}
function span(s,t){const e=document.createElement('span');e.style.cssText=s||'';e.textContent=t;return e;}
function btn(s,t,cb){const e=document.createElement('button');e.style.cssText=s||'';e.textContent=t;if(cb)e.onclick=cb;return e;}
function inp(type,ph,val,style){
  const e=document.createElement('input');
  e.type=type;e.placeholder=ph;e.value=val||'';
  if(style)e.style.cssText=style;
  return e;
}

// ─── SUPABASE ─────────────────────────────────────────────────────────────────
let sb;
function initSupabase(){
  try{
    const {createClient}=window.supabase||supabaseJs||{};
    if(createClient){
      sb=createClient(SB_URL,SB_KEY);
      return true;
    }
  }catch(e){}
  return false;
}

async function sbSignUp(email,pass){
  if(!sb)throw new Error('Cannot connect to server. Check your internet connection.');
  const {data,error}=await sb.auth.signUp({email,password:pass});
  if(error)throw error;
  return data;
}
async function sbSignIn(email,pass){
  if(!sb)throw new Error('Cannot connect to server. Check your internet connection.');
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error)throw error;
  return data;
}
async function sbSignOut(){
  if(sb)await sb.auth.signOut();
  currentUser=null;userPlan='free';
}
async function loadUserData(){
  if(!sb||!currentUser)return;
  try{
    const {data:p}=await sb.from('profiles').select('*').eq('id',currentUser.id).single();
    const {data:pr}=await sb.from('progress').select('*').eq('id',currentUser.id).single();
    if(p){S.name=p.name||S.name;S.studyField=p.current_sem||S.studyField;userPlan=p.plan||'free';}
    if(pr){
      S.studyDays=pr.study_days||0;S.lastStudyDate=pr.last_study_date||'';
      S.reviewed=pr.reviewed||[];S.strength=pr.strength||{};
      S.quizScores=pr.quiz_scores||{};
      if(pr.topics&&Object.keys(pr.topics).length>0)S.subjects=pr.topics;
      if(pr.review_date!==TODAY){S.reviewed=[];S.reviewDate=TODAY;}
    }
    if(p&&S.screen==='onboarding')S.screen='home';
  }catch(e){console.log('Using local data');}
}
async function syncToCloud(){
  if(!sb||!currentUser)return;
  try{
    await sb.from('profiles').upsert({id:currentUser.id,name:S.name,current_sem:S.studyField,plan:userPlan});
    await sb.from('progress').upsert({id:currentUser.id,study_days:S.studyDays,last_study_date:S.lastStudyDate,reviewed:S.reviewed,review_date:TODAY,strength:S.strength,quiz_scores:S.quizScores,topics:S.subjects});
  }catch(e){}
}

function render(){
  saveState();

  app.innerHTML='';

  if(S.screen==='onboarding'){app.appendChild(renderOnboarding());return;}
  app.appendChild(renderTopbar());

  else if(S.screen==='quizrun'&&S.activeQuiz)page.appendChild(renderQuizRun());
  else if(S.screen==='revision'&&S.activeTopic)page.appendChild(renderRevision());
  else if(S.screen==='progress')page.appendChild(renderProgress());
  else if(S.screen==='subjects')page.appendChild(renderSubjects());
  else if(S.screen==='mynotes')page.appendChild(renderMyNotes());

  const submitBtn=btn('background:rgba(79,195,247,0.15);border:1px solid rgba(79,195,247,0.4);color:#4fc3f7;border-radius:9px;padding:13px;font-size:13px;width:100%;font-weight:bold;margin-bottom:14px;',mode==='login'?'Sign In →':'Create Free Account →',async()=>{
    const email=emailInp.value.trim();const pass=passInp.value.trim();
    if(!email||!pass){errDiv.textContent='Please fill in email and password.';errDiv.style.display='block';return;}
    if(pass.length<6){errDiv.textContent='Password must be at least 6 characters.';errDiv.style.display='block';return;}
    submitBtn.textContent='Please wait...';submitBtn.disabled=true;errDiv.style.display='none';okDiv.style.display='none';

function loadScript(src) {
  return new Promise(function(res, rej) {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

async function extractTextFromFile(file) {
  return new Promise(function(resolve, reject) {
    const reader = new FileReader();
    if (file.type === 'application/pdf') {
      reader.onload = async function(e) {
        try {
          if (!window.pdfjsLib) {
            await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
          }
          const pdf = await window.pdfjsLib.getDocument({ data: e.target.result }).promise;
          let text = '';
          for (let i = 1; i <= Math.min(pdf.numPages, 20); i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            text += content.items.map(function(item) { return item.str; }).join(' ') + '\n';
          }
          resolve(text.trim().slice(0, 8000));
        } catch(err) { reject(err); }
      };
      reader.readAsArrayBuffer(file);
    } else {
      reader.onload = function(e) { resolve(e.target.result.slice(0, 8000)); };
      reader.onerror = reject;
      reader.readAsText(file);
    }
  });
}

        catch(e2) { questions = [{q:'What is the most important concept in your uploaded material?',options:['Surface-level memorisation','Deep understanding of core principles','Skipping difficult sections','Speed reading only'],ans:1,explanation:'Deep understanding always outperforms memorisation for long-term retention.'},{q:'How should you approach studying this material?',options:['Read once and forget','Active recall and spaced repetition','Highlight everything','Study only the night before'],ans:1,explanation:'Active recall with spaced repetition is the most effective study technique proven by research.'},{q:'What does exam success in this subject require?',options:['Luck','Memorising the textbook word-for-word','Understanding principles and practising application','Studying for 24 hours straight'],ans:2,explanation:'Understanding and application always beats memorisation in exams.'},{q:'How do you identify gaps in your knowledge of this material?',options:['Assume you know everything','Test yourself regularly','Re-read the same pages','Ask a friend to explain it'],ans:1,explanation:'Regular self-testing reveals exactly where knowledge gaps exist.'},{q:'What is the best follow-up after studying this material?',options:['Immediately start something else','Close the book and never review','Practice questions and periodic review','Watch TV to relax your brain'],ans:2,explanation:'Practice questions and periodic review dramatically improve retention and exam performance.'}]; }
        const noteIdx = S.notes.findIndex(function(n) { return n.id === note.id; });
        if(noteIdx >= 0) { S.notes[noteIdx].quizzes = questions; S.notes[noteIdx].lastQuizDate = TODAY; S.activeNote = S.notes[noteIdx]; }
        S.noteQuiz = { questions: questions, current:0, selected:null, answered:false, score:0, answers:[], finished:false };
        contentDiv.innerHTML = ''; renderNoteQuizContent(contentDiv);
      } catch(err) {
        loading.innerHTML = '<div style="color:#ff8a80;font-size:12px;padding:10px;">\u26A0 ' + err.message + '</div>';
      }
    })();
  }
  return wrap;
}

function renderNoteQuizContent(container) {
  const qs = S.noteQuiz; if(!qs) return;
  if(qs.finished) {
    const pct = Math.round((qs.score/qs.questions.length)*100);
    const grade = qs.score>=4?'#69f0ae':qs.score>=3?'#ffb74d':'#ff8a80';
    const rb = div('background:linear-gradient(145deg,#0d2219,rgba(6,6,16,0.9));border:1px solid rgba(105,240,174,0.3);border-radius:14px;padding:22px;text-align:center;margin-bottom:14px;');
    rb.appendChild(div('font-size:36px;margin-bottom:10px;', [qs.score>=4?'\u{1F3C6}':qs.score>=3?'\u2B50':'\u{1F4DA}']));
    const sc = div('font-weight:bold;font-size:26px;margin-bottom:3px;'); sc.style.color=grade; sc.textContent=qs.score+'/'+qs.questions.length; rb.appendChild(sc);
    const lb = div('font-size:13px;margin-bottom:6px;'); lb.style.color=grade; lb.textContent=qs.score>=4?'Excellent!':qs.score>=3?'Good Work!':'Keep Revising!'; rb.appendChild(lb);
    rb.appendChild(div('color:#475569;font-size:11px;', [pct+'% correct'])); container.appendChild(rb);
    const rev = div('background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:13px;margin-bottom:14px;');
    rev.appendChild(div('color:#475569;font-size:9px;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;', ['REVIEW']));
    qs.questions.forEach(function(q,i) {
      const a = qs.answers[i];
      const item = div('padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.05);');
      const qt = div('font-size:11px;color:#cbd5e1;margin-bottom:4px;'); qt.textContent='Q'+(i+1)+': '+q.q; item.appendChild(qt);
      const ca = div('font-size:10px;color:#69f0ae;'); ca.textContent='\u2713 '+q.options[q.ans]; item.appendChild(ca);
      if(!a.correct){const wa=div('font-size:10px;color:#ff8a80;margin-top:2px;');wa.textContent='\u2717 You answered: '+q.options[a.selected];item.appendChild(wa);}
      if(q.explanation){const exp=div('font-size:10px;color:#475569;margin-top:3px;font-style:italic;');exp.textContent='\u{1F4A1} '+q.explanation;item.appendChild(exp);}
      rev.appendChild(item);
    });
    container.appendChild(rev);
    container.appendChild(btn('background:rgba(105,240,174,0.12);border:1px solid rgba(105,240,174,0.3);color:#69f0ae;border-radius:9px;padding:12px;font-size:12px;width:100%;font-weight:bold;', '\u2190 Back to My Notes', function() { S.noteQuiz=null; S.screen='mynotes'; render(); }));
    return;
  }
  const q = qs.questions[qs.current];
  const tr = div('display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;');
  const tl = span('color:#69f0ae;font-size:9px;letter-spacing:2px;', ''); tl.textContent='QUESTION '+(qs.current+1)+' OF '+qs.questions.length;
  const ts = span('color:#475569;font-size:10px;', ''); ts.textContent='Score: '+qs.score+'/'+qs.current;
  tr.appendChild(tl); tr.appendChild(ts); container.appendChild(tr);
  const pw = div('background:rgba(255,255,255,0.06);border-radius:3px;height:4px;margin-bottom:18px;');
  pw.appendChild(div('background:#69f0ae;height:100%;border-radius:3px;width:'+(qs.current/qs.questions.length*100)+'%;'));
  container.appendChild(pw);
  const qc = div('background:linear-gradient(145deg,#0d2219,rgba(6,6,16,0.9));border:1px solid rgba(105,240,174,0.2);border-radius:12px;padding:16px;margin-bottom:16px;');
  const qt2 = div('font-size:13px;color:#e2e8f0;line-height:1.6;'); qt2.textContent=q.q; qc.appendChild(qt2); container.appendChild(qc);
  q.options.forEach(function(opt,idx) {
    let bc='rgba(255,255,255,0.04)',bo='rgba(255,255,255,0.08)',tc='#94a3b8';
    if(qs.answered){if(idx===q.ans){bc='rgba(105,240,174,0.12)';bo='#69f0ae55';tc='#69f0ae';}else if(idx===qs.selected){bc='rgba(255,82,82,0.1)';bo='#ff525244';tc='#ff8a80';}}
    const b = div('border-radius:9px;padding:11px 13px;cursor:pointer;display:flex;align-items:center;gap:9px;width:100%;margin-bottom:8px;font-size:12px;');
    b.style.background=bc; b.style.border='1px solid '+bo; b.style.color=tc;
    const ci = div('width:21px;height:21px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;');
    ci.style.border='1px solid '+tc+'44'; ci.style.background=tc+'11';
    ci.textContent=qs.answered?(idx===q.ans?'\u2713':idx===qs.selected?'\u2717':String.fromCharCode(65+idx)):String.fromCharCode(65+idx);
    b.appendChild(ci); b.appendChild(document.createTextNode(opt));
    if(!qs.answered){b.onclick=function(){const correct=idx===q.ans;S.noteQuiz.selected=idx;S.noteQuiz.answered=true;if(correct)S.noteQuiz.score++;S.noteQuiz.answers.push({selected:idx,correct});container.innerHTML='';renderNoteQuizContent(container);};}
    container.appendChild(b);
  });
  if(qs.answered) {
    if(q.explanation){const exp=div('background:rgba(79,195,247,0.06);border:1px solid rgba(79,195,247,0.15);border-radius:8px;padding:10px;margin-bottom:8px;');exp.appendChild(div('font-size:10px;color:#4fc3f7;margin-bottom:3px;',['\u{1F4A1} EXPLANATION']));const et=div('font-size:11px;color:#94a3b8;line-height:1.6;');et.textContent=q.explanation;exp.appendChild(et);container.appendChild(exp);}
    const nxtTxt = qs.current+1>=qs.questions.length?'See Results \u2192':'Next Question \u2192';
    container.appendChild(btn('background:rgba(105,240,174,0.12);border:1px solid rgba(105,240,174,0.3);color:#69f0ae;border-radius:9px;padding:12px;font-size:12px;width:100%;font-weight:bold;margin-top:4px;', nxtTxt, function(){if(qs.current+1>=qs.questions.length){S.noteQuiz.finished=true;}else{S.noteQuiz.current++;S.noteQuiz.selected=null;S.noteQuiz.answered=false;}container.innerHTML='';renderNoteQuizContent(container);}));
  }
}

  const ok=initSupabase();
  if(ok){
    try{
      const {data:{session}}=await sb.auth.getSession();
      if(session?.user){currentUser=session.user;await loadUserData();}
    }catch(e){console.log('Session check failed, showing login');}
  }
  render();
}
boot();
